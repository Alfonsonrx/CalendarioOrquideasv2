
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendario de Riego</title>
    <!-- Tipografías del rediseño; sin red, las del sistema (spec 104 FR-1.c) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600&display=swap">


    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">

        <!-- BARRA LATERAL (spec 104 FR-2) -->
        <aside class="sidebar">

            <div class="logo">
                <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
                    <g fill="#e7a9d6">
                        <ellipse cx="16" cy="8" rx="5" ry="7"/>
                        <ellipse cx="8" cy="15" rx="7" ry="4.5" transform="rotate(-20 8 15)"/>
                        <ellipse cx="24" cy="15" rx="7" ry="4.5" transform="rotate(20 24 15)"/>
                    </g>
                    <path d="M12 20c1 5 7 5 8 0-2 2-6 2-8 0z" fill="#fff"/>
                    <circle cx="16" cy="16" r="2.5" fill="#f6d77a"/>
                </svg>
                <span>Orquídeas</span>
            </div>

            <nav aria-label="Páginas">
                <a href="Home/home.html">Home</a>
                <a href="Datos/datos.html">Datos</a>
                <a href="index.html" class="activo" aria-current="page">Calendario de Riego</a>
                <a href="Configuracion/configuracion.html">Configuración</a>
            </nav>

            <button type="button" class="salir">Cerrar sesión</button>

        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main>
        <div class="wrap">

            <!-- ENCABEZADO (spec 104 FR-3); la campana la pone notificaciones.js -->
            <header class="head">
                <div>
                    <h1>Calendario de riego</h1>
                    <p>Programa, edita o elimina los riegos de tus orquídeas</p>
                </div>
                <div class="head-tools">
                    <div class="avatar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div>
                </div>
            </header>


            <!-- SECCION DEL CALENDARIO -->
            <section class="contenido-calendario">

                <div class="calendario">

                    <div class="calendario-encabezado">

                        <h2>Calendario de Riego</h2>

                        <div class="navegacion-mes">

                            <button id="mesAnterior">&lt;</button>

                            <h3 id="mesActual"></h3>

                            <button id="mesSiguiente">&gt;</button>

                        </div>

                    </div>


                    <!-- DIAS DE LA SEMANA -->
                    <div class="dias-semana">

                        <div>Lun</div>
                        <div>Mar</div>
                        <div>Mié</div>
                        <div>Jue</div>
                        <div>Vie</div>
                        <div>Sáb</div>
                        <div>Dom</div>

                    </div>


                    <!-- DIAS DEL MES -->
                    <div id="diasCalendario" class="dias-calendario">

                    </div>

                </div>


                <!-- PANEL DE PROXIMOS RIEGOS -->
                <div class="proximos-riegos">

                    <h2>Próximos riegos</h2>

                    <div id="listaRiegos">

                        <p>No hay riegos programados.</p>

                    </div>

                </div>

            </section>


            <!-- VENTANA PARA PROGRAMAR EL RIEGO -->
            <div id="modalRiego" class="modal">

                <div class="modal-contenido">

                    <!-- ENCABEZADO DEL MODAL -->
                    <div class="modal-encabezado">

                        <h2>Programar riego</h2>

                        <button
                            id="cerrarModal"
                            class="cerrar-modal"
                            type="button">
                            &times;
                        </button>

                    </div>


                    <!-- FECHA SELECCIONADA -->
                    <p id="fechaSeleccionada"></p>


                    <!-- RIEGOS YA PROGRAMADOS ESE DIA (clic para editar) -->
                    <div id="riegosDelDia"></div>


                    <!-- SELECCIONAR HORA -->
                    <label for="horaRiego">
                        Seleccionar hora de riego:
                    </label>

                    <input
                        type="time"
                        id="horaRiego"
                    >


                    <!-- BOTONES DEL MODAL -->
                    <div class="modal-botones">

                        <button
                            id="eliminarRiego"
                            class="btn-eliminar"
                            type="button">
                            Eliminar
                        </button>

                        <button
                            id="cancelarRiego"
                            class="btn-cancelar"
                            type="button">
                            Cancelar
                        </button>

                        <button
                            id="guardarRiego"
                            class="btn-guardar"
                            type="button">
                            Guardar riego
                        </button>

                    </div>

                </div>

            </div>

        </div>
        </main>

    </div>


    <!-- ARCHIVO JAVASCRIPT -->
    <script src="api.js"></script>

    <script src="notificaciones.js"></script>

    <script src="calendario.js"></script>

</body>
</html>
